[build]
  command = "npm run build"
  publish = ".next"

[build.processing]
  skip_processing = true

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"
  # Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in Netlify UI
  # Optional Sentry — set in Netlify UI (do not commit values here):
  #   SENTRY_DSN — server-only ingest DSN used by reportServerError (not NEXT_PUBLIC_)
  #   SENTRY_SERVER_SAMPLE_RATE — 0..1, default 1 if unset
  #   In-memory flood throttle is 5 POSTs / 10s per isolate; cold starts reset the counter.
  #   Configure Sentry project-level rate limiting as the global backstop.
  #   NEXT_PUBLIC_SENTRY_DSN — browser client reporting

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# Static assets — immutable cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files — immutable cache
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Image files — 1 day cache
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers for all routes (backup to next.config.mjs).
# Canonical connect tokens live in security-headers.json (CI: npm run check:security-headers).
# script-src keeps 'unsafe-inline' because Next.js App Router emits framework-generated inline
# bootstrap/flight scripts (self.__next_f) that cannot be hashed or nonced under static generation.
# Our own scripts live in /pref-bootstrap.js and /ga-init.js (external, CSP-safe).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
